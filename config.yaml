# ============================================================
# Best-Face: конфигурация
# ============================================================

models:
  # Модели лежат в папке models/ (w600k_mbf.onnx скачивается при первом запуске, см. README.md)
  # Детектор лиц (YuNet, cv2.FaceDetectorYN)
  detector: "models/face_detection_yunet_2023mar.onnx"
  # ArcFace 512-dim — для группировки серий
  arcface: "models/w600k_mbf.onnx"
  # Human FaceRes 1024-dim — метрика «узнаваемости» Q8 (+ пол/возраст).
  # null — отключить: Q8 тогда считается по ArcFace-эмбеддингам
  faceres: "models/human_faceres.onnx"
  # NIMA aesthetic quality scorer (MobileNetV2, обучен на AVA)
  # Модель лежит в репозитории (пересборка: python export_nima.py)
  # null — отключить Q9: вместо NIMA используется оценка освещения по гистограмме
  nima: "models/nima_mobilenetv2.onnx"
  # MediaPipe FaceLandmarker: глаза (EAR), взгляд, мимика (blendshapes), поза головы.
  # null — отключить (глаза будут оцениваться по пикселям, взгляд не оценивается)
  ear: "models/face_landmarker.task"

detection:
  conf_threshold: 0.5 # минимальный confidence детектора
  nms_threshold: 0.4 # NMS IoU
  min_face_px: 50 # минимальный размер лица в пикселях (меньшая сторона bbox)
  max_det_size: 1280 # на такую ширину масштабируем изображение перед детекцией
  # Какое лицо брать, если в кадре их несколько: largest | central | best_conf
  multi_face_policy: largest

clustering:
  # Режим группировки:
  #   person — один кластер на человека во всей папке: лучший кадр выбирается
  #            один на человека, даже если его снимали несколько раз (по умолчанию)
  #   series — сначала разрез на серии по паузам в съёмке (EXIF), затем кластеризация
  #            по лицу внутри серии: один лучший кадр на каждую серию съёмки
  mode: person
  series_gap_sec: 14.0 # пауза между соседними кадрами, начинающая новую серию, сек
  # Порог cosine-сходства ArcFace 512-dim для «один человек».
  # Кластеризация average-linkage: порог применяется к СРЕДНЕМУ сходству кластеров
  threshold: 0.50
  # Временной хинт: кадры, снятые рядом, получают бонус (threshold - threshold_time_hint)
  time_window_sec: 8.0 # окно «снято рядом» по EXIF DateTimeOriginal, сек
  time_window_frames: 8 # то же в номерах файлов, если EXIF-времени нет
  threshold_time_hint: 0.40 # чуть ниже основного: «плохой» кадр той же серии
  # Кадры, снятые далеко по времени, штрафуются. Для задачи «один человек — один кадр»
  # выключено (0): один человек, снятый в разное время, должен остаться в одном кластере
  time_far_sec: 120.0
  time_far_penalty: 0.0
  # Кластеры со средним cosine внутри ниже этого значения дробятся строже
  # и помечаются low_cohesion (0 — не дробить). Размер кластера не важен.
  min_cohesion: 0.60
  split_step: 0.03
  max_split_rounds: 6
  # Если кадров больше этого числа, режим person работает в два этапа (по временным
  # сегментам, затем слияние центроидов): матрица сходства n×n не помещалась бы в память
  dense_limit: 6000

scoring:
  # Серия помечается «почти равные кадры», если два лучших score отличаются меньше этого
  # и прошедших фильтры кадров не больше close_call_max_pool (при большом выборе любой подойдёт)
  close_call_margin: 0.02
  close_call_max_pool: 6
  # Приоритет — серьёзное лицо, смотрящее ровно в камеру: Q4 (нейтральность), Q10 (взгляд),
  # Q11 (поза), Q3 (глаза). Сумма весов = 1.
  weights:
    Q1_sharpness: 0.12 # резкость (≥80% от эталона серии = «одинаково резко»)
    Q2_frontality: 0.08 # фронтальность по 5 точкам
    Q3_eye_open: 0.15 # открытость глаз (EAR + blink + squint)
    Q4_expression: 0.17 # нейтральность выражения: улыбка, открытый рот, хмурость, поднятые брови — штраф
    Q5_face_size: 0.04 # размер лица
    Q6_exposure: 0.04 # экспозиция / освещение
    Q7_confidence: 0.02 # confidence детектора
    Q8_centrality: 0.10 # «узнаваемость» = близость к центроиду группы (FaceRes)
    Q9_nima: 0.06 # NIMA aesthetic значение: освещение/композиция кропа лица
    Q10_gaze: 0.12 # взгляд в камеру (радужка + eyeLook*, с учётом поворота головы)
    Q11_pose: 0.10 # голова ровно: гладкий штраф за yaw, pitch и наклон (roll)

  hard_gates:
    max_yaw_deg: 25.0 # поворот головы влево/вправо
    max_pitch_deg: 20.0 # наклон вверх/вниз (нужен MediaPipe; иначе не применяется)
    max_roll_deg: 15.0 # наклон головы к плечу (нужен MediaPipe)
    max_jaw_open: 0.10 # открытый рот (blendshape jawOpen; нужен MediaPipe)
    min_frontal_ratio: 0.45 # фронтальность по 5 точкам (0=профиль, 1=анфас)
    min_ear: 0.58 # минимальный Q3 eye_open: открытые~0.65-0.85, прикрытые~0.42-0.58
    min_sharpness_rel: 0.15 # кадр выбрасывается если sharpness < max_sharpness * rel
    # Относительные фильтры: кадр выбывает, если он хуже лучших кадров ЭТОГО ЖЕ человека
    # больше чем на указанную величину и есть из чего выбрать (0 — выключить)
    max_eye_gap: 0.08 # полузакрытые глаза / прищур
    max_gaze_gap: 0.25 # взгляд в сторону, вверх или вниз
    max_expr_gap: 0.12 # улыбка, губы трубочкой и другая мимика (в единицах выражения; эталон — самое нейтральное лицо серии)

performance:
  workers: 4 # потоков для чтения и декодирования JPEG (предзагрузка кадров)
